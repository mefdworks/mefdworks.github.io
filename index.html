<meta property="og:title" content="Maicol Espinosa · Estrategia Digital">
<meta property="og:description" content="Todo oídos, todo datos. Mi página nueva está en camino.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://maicolespinosa.com">
<meta name="theme-color" content="#1A1A2E">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1A2E;--lav:#5360A5;--lav2:#6C77C1;--yel:#F9B431;--soft:#EEE8FF;--softy:#FFF8E0}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--softy);display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 16px}
.card{background:#fff;border-radius:32px;max-width:640px;width:100%;padding:48px 40px 40px;text-align:center;box-shadow:0 20px 60px rgba(83,96,165,.14)}
h1{font-weight:800;font-size:clamp(34px,7vw,52px);line-height:1.05;letter-spacing:-.02em}
h1 span{background:linear-gradient(transparent 62%,var(--yel) 62%)}
.sub{margin:20px auto 0;max-width:440px;font-size:18px;line-height:1.5;color:#3d3d57}
.steps{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:28px 0 0;padding:0;list-style:none}
.steps li{background:var(--soft);border-radius:999px;padding:8px 18px;font-weight:600;font-size:15px;color:var(--lav)}
.steps li:nth-child(3){background:var(--yel);color:var(--ink)}
.soon{margin-top:32px;font-size:15px;color:#6b6b85}
.cta{display:inline-block;margin-top:20px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:999px;transition:transform .15s,background .15s}
.cta:hover{background:var(--lav);transform:translateY(-2px)}
.cta:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
footer{text-align:center;padding:0 16px 28px;font-size:13px;color:#6b6b85}
@media(max-width:480px){.card{padding:36px 22px 32px;border-radius:24px}.sub{font-size:16px}}
@media(prefers-reduced-motion:reduce){.cta{transition:none}}
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>Todo oídos,<br><span>todo datos.</span></h1>
    <p class="sub">Estoy armando mi página nueva. Mientras tanto, así trabajo:</p>
    <ul class="steps">
      <li>Primero escucho</li>
      <li>Después mido</li>
      <li>Luego invierto</li>
    </ul>
    <p class="soon">Vuelve pronto. Si quieres hablar de tu pauta, escríbeme.</p>
    <a class="cta" href="https://wa.me/573245679616?text=Hola%20Maicol%2C%20vi%20tu%20p%C3%A1gina%20y%20quiero%20hablar%20de%20mi%20pauta.%20Te%20cuento%20de%20mi%20negocio%3A%20">Escríbeme por WhatsApp</a>
  </section>
</main>
<footer>© 2026 · Bogotá, Colombia</footer>
</body>
</html>
